name: Daily refresh

on:
  schedule:
    - cron: "7 5,17 * * *" # 05:07 and 17:07 UTC (every 12 hours)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - name: Refresh data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/refresh.py
      - name: Rebuild page
        run: python3 scripts/build_page.py
      - name: Preview image
        # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners; never blocks the data refresh.
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/og_image.py
      - name: Commit
        run: |
          git config user.name "stackstate-bot"
          git config user.email "stackstate-bot@users.noreply.github.com"
          git add site data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh $(date -u +%F)"
          git push
      - name: Check the refresh was complete
        # Runs after the commit, so KEV updates still land; a red run emails the repo admins.
        run: |
          python3 - <<'EOF'
          import json, sys
          log = json.load(open("data/last-refresh.json"))
          problems = log["errors"] + ([] if log["llm"] else ["OPENROUTER_API_KEY is not set: no news incidents (Attack) or papers (Defense) were added"])
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          EOF
