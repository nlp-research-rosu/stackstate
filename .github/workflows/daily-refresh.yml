name: Daily refresh

on:
  schedule:
    - cron: "7 5,17 * * *" # 05:07 and 17:07 UTC (every 12 hours)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic playwright
      - name: Refresh data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/refresh.py
      - name: Rebuild page
        run: python3 scripts/build_page.py
      - name: Preview image
        # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners; never blocks the data refresh.
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/og_image.py
      - name: Commit
        run: |
          git config user.name "stackstate-bot"
          git config user.email "stackstate-bot@users.noreply.github.com"
          git add site data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh $(date -u +%F)"
          git push
